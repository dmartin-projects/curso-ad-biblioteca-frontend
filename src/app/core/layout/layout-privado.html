<header>
  <strong>Biblioteca</strong>
  <nav>
    <a routerLink="/catalogo" routerLinkActive="activo">Catálogo</a>
    <a routerLink="/prestamos" routerLinkActive="activo">Mis préstamos</a>
    <a routerLink="/gastos" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }"
      >Gastos</a
    >
    @if (auth.tieneRol('bibliotecario')) {
      <a routerLink="/admin" routerLinkActive="activo">Administración</a>
    }
  </nav>
  <span class="usuario">{{ auth.usuario()?.nombre || auth.usuario()?.email }}</span>
  <button type="button" (click)="auth.logout()">Salir</button>
</header>
<main><router-outlet /></main>
<aside>
  <app-resumen-carrito />
  <app-buscador-autores />
</aside>
