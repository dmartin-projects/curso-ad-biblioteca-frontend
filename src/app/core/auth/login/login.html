<main>
  <h1>Iniciar sesión</h1>
  <!-- cada campo: aria-invalid (está mal) y aria-describedby (por qué) -->
  <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <label>
      Email
      <input
        #email
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="mostrarError('email')"
        [attr.aria-describedby]="mostrarError('email') ? 'error-email' : null"
      />
    </label>
    @if (mostrarError('email')) {
      <small id="error-email" class="error">
        {{ form.controls.email.hasError('required') ? 'Obligatorio' : 'Email no válido' }}
      </small>
    }
    <label>
      Contraseña
      <input
        #password
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="mostrarError('password')"
        [attr.aria-describedby]="mostrarError('password') ? 'error-password' : null"
      />
    </label>
    @if (mostrarError('password')) {
      <small id="error-password" class="error">Obligatoria</small>
    }
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <button type="submit" [disabled]="enviando()">Entrar</button>
  </form>
</main>
