<nav aria-label="Paginación">
  <button type="button" (click)="pagina.set(pagina() - 1)" [disabled]="pagina() <= 1">
    Anterior
  </button>
  <span>Página {{ pagina() }} de {{ paginas() }}</span>
  <button type="button" (click)="pagina.set(pagina() + 1)" [disabled]="pagina() >= paginas()">
    Siguiente
  </button>
</nav>
