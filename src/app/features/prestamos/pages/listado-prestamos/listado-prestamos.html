<h1>Préstamos</h1>
<label for="estado-prestamo">Estado</label>
<select id="estado-prestamo" (change)="estado.set($any($event.target).value)">
  <option value="">Todos</option>
  <option value="activo">Activos</option>
  <option value="devuelto">Devueltos</option>
</select>
@if (prestamos.isLoading()) {
  <small aria-busy="true">Cargando…</small>
}
<ul>
  @for (p of prestamos.value().results; track p.id) {
    <li>{{ p.libro.titulo }}</li>
  }
</ul>
<p class="total">{{ prestamos.value().count }} en total · página {{ pagina() }}</p>
<button type="button" (click)="pagina.set(pagina() + 1)">Siguiente</button>
