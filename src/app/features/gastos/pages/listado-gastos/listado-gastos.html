<button type="button" (click)="clicGuardar$.next()">Guardar gasto</button>
<ul>
  @for (g of gastos$ | async; track g.id) {
    <li>
      <span class="concepto">{{ g.concepto }}</span>
      <button
        type="button"
        class="borrar"
        [attr.aria-label]="'Borrar ' + g.concepto"
        (click)="borrar(g)"
      >
        Borrar
      </button>
    </li>
  }
</ul>
