<app-tarjeta>
  <h1 tarjeta-titulo [style.view-transition-name]="'titulo-' + libro().id">
    {{ libro().titulo }}
  </h1>
  <app-pestanas>
    <app-pestana titulo="Datos">
      <p class="autores">{{ autores() }}</p>
      <p>ISBN {{ libro().isbn }} · {{ libro().publicado | date: 'yyyy' }}</p>
    </app-pestana>
    <app-pestana titulo="Sinopsis">
      <p>{{ libro().sinopsis || 'Sin sinopsis.' }}</p>
      @if (libro().paginas) {
        <p>{{ libro().paginas }} páginas</p>
      }
    </app-pestana>
  </app-pestanas>
  <div tarjeta-acciones>
    <button type="button" (click)="reservar.emit(libro().id)">Reservar</button>
  </div>
</app-tarjeta>
