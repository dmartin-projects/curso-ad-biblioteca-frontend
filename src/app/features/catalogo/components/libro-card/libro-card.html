<h3 [style.view-transition-name]="'titulo-' + libro().id">
  <a
    [routerLink]="['/catalogo/libros', libro().id]"
    [appResaltar]="libro().titulo"
    [termino]="termino()"
  ></a>
</h3>
<p class="autores">{{ libro().autores.join(', ') }}</p>
@if (libro().publicado; as publicado) {
  <p>Publicado: {{ publicado | date: 'longDate' }}</p>
}
@switch (libro().ejemplares_disponibles) {
  @case (0) {
    <span class="etiqueta etiqueta--agotado">Agotado</span>
  }
  @case (1) {
    <span class="etiqueta etiqueta--ultimo">¡Último ejemplar!</span>
  }
  @default {
    <span class="etiqueta">{{ libro().ejemplares_disponibles }} disponibles</span>
  }
}
<button type="button" (click)="onReservar()" [disabled]="agotado()">Reservar</button>
