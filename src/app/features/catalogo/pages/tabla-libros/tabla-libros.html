<h1>Catálogo (tabla)</h1>
@if (libros.isLoading()) {
  <mat-progress-bar mode="indeterminate" />
}
<table
  mat-table
  [dataSource]="filas()"
  matSort
  (matSortChange)="ordenar($event)"
  [matSortActive]="campoOrden()"
  [matSortDirection]="direccion()"
>
  <ng-container matColumnDef="titulo">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
    <td mat-cell *matCellDef="let l">
      <a [routerLink]="['/catalogo/libros', l.id]">{{ l.titulo }}</a>
    </td>
  </ng-container>
  <ng-container matColumnDef="autores">
    <th mat-header-cell *matHeaderCellDef>Autores</th>
    <td mat-cell *matCellDef="let l">{{ l.autores.join(', ') }}</td>
  </ng-container>
  <ng-container matColumnDef="publicado">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicado</th>
    <td mat-cell *matCellDef="let l">{{ l.publicado | date: 'yyyy' }}</td>
  </ng-container>
  <ng-container matColumnDef="ejemplares_disponibles">
    <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before">Disponibles</th>
    <td mat-cell *matCellDef="let l" class="num">{{ l.ejemplares_disponibles }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
  <tr class="mat-mdc-no-data-row" *matNoDataRow>
    <td [attr.colspan]="columnas.length">Sin libros</td>
  </tr>
</table>
<mat-paginator
  [length]="total()"
  [pageIndex]="page() - 1"
  [pageSize]="page_size()"
  [pageSizeOptions]="[20, 50, 100]"
  (page)="paginar($event)"
  showFirstLastButtons
/>
