<a routerLink="/catalogo">← Catálogo</a>
@switch (libro.status()) {
  @case ('loading') {
    <p class="spinner" aria-busy="true">Cargando…</p>
  }
  @case ('error') {
    <div role="alert">
      <p>No se pudo cargar el libro.</p>
      <button type="button" (click)="libro.reload()">Reintentar</button>
    </div>
  }
  @default {
    @if (libro.hasValue()) {
      @if (portada()) {
        <img class="portada" [src]="portada()" alt="" width="120" />
      }
      <app-detalle-libro [libro]="libro.value()" />
      @if (auth.tienePermiso('catalogo.change_libro')) {
        <app-subir-portada
          [progreso]="progreso()"
          [error]="errorSubida()"
          (archivo)="subirPortada($event)"
        />
      }
      <a [routerLink]="['/catalogo/libros', idNumerico() + 1]">Siguiente libro →</a>
    }
  }
}
