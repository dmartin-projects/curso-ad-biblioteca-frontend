@let disponibles = visibles().reduce((suma, l) => suma + l.ejemplares_disponibles, 0);

<header>
  <h2>Catálogo</h2>
  <input
    #campo
    type="search"
    placeholder="Buscar (pulsa /)"
    aria-label="Buscar por título o autor"
    [value]="filtro()"
    (input)="filtro.set(campo.value)"
    (keydown.escape)="filtro.set('')"
  />
  <p class="contador">{{ total() }} libros · {{ disponibles }} ejemplares disponibles</p>
  <app-panel-filtros>
    <p>Aquí irán los filtros (módulo 53).</p>
  </app-panel-filtros>
</header>

<section class="rejilla">
  @for (libro of visibles(); track libro.id) {
    <app-libro-card [libro]="libro" (reservar)="reservar($event)" />
  } @empty {
    <p>No hay libros que coincidan.</p>
  }
</section>
